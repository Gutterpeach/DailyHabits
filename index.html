<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2E4A31">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <!-- ==================== TAB 1: HABITS VIEW ==================== -->
    <div id="view-habits" class="tab-view active">
      <header>
        <h1>Habits</h1>
        <button id="open-modal-btn" class="add-btn">+</button>
      </header>

      <!-- Date Navigation Bar -->
      <div class="date-navigator">
        <button id="prev-date-btn" class="nav-arrow-btn">‹</button>
        <div class="date-display-wrapper">
          <span id="date-display-label" class="date-label">Today</span>
          <button id="today-shortcut-btn" class="today-btn hidden">Go to Today</button>
        </div>
        <button id="next-date-btn" class="nav-arrow-btn">›</button>
      </div>

      <!-- Frequency Filter Tabs -->
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="all">All</button>
        <button class="tab-btn" data-tab="daily">Daily</button>
        <button class="tab-btn" data-tab="weekly">Weekly</button>
        <button class="tab-btn" data-tab="monthly">Monthly</button>
      </nav>

      <main>
        <!-- Active Habits -->
        <div id="active-habit-list" class="habit-list"></div>

        <!-- Completed Section -->
        <div id="completed-section" class="completed-section hidden">
          <h2>Completed</h2>
          <div id="completed-habit-list" class="habit-list"></div>
        </div>
      </main>
    </div>

    <!-- ==================== TAB 2: TO-DO VIEW ==================== -->
    <div id="view-todo" class="tab-view hidden">
      <header>
        <h1>To-Do List</h1>
      </header>

      <!-- Daily / Weekly Sub-tabs -->
      <nav class="tab-nav">
        <button class="todo-type-btn active" data-todo-type="daily">Daily</button>
        <button class="todo-type-btn" data-todo-type="weekly">Weekly</button>
      </nav>

      <!-- Add New Task Input Bar -->
      <div class="todo-input-group">
        <input type="text" id="todo-input" placeholder="Add a new task..." />
        <button id="add-todo-btn" class="btn primary">+</button>
      </div>

      <!-- Active Tasks -->
      <div id="todo-list" class="todo-list"></div>

      <!-- Completed Tasks Section -->
      <div id="todo-completed-section" class="completed-section hidden">
        <h2>Completed Tasks</h2>
        <div id="todo-completed-list" class="todo-list"></div>
      </div>
    </div>

    <!-- ==================== TAB 3: IDEAL DAY VIEW ==================== -->
    <div id="view-ideal-day" class="tab-view hidden">
      <header>
        <h1>My Ideal Day</h1>
      </header>

      <div class="ideal-day-container">
        <!-- Vision / Paragraph Section -->
        <div class="ideal-card">
          <label class="field-label" for="ideal-vision-text">Daily Vision & Mood</label>
          <textarea id="ideal-vision-text" rows="4" placeholder="Describe what you would like your ideal day to look like..."></textarea>
        </div>

        <!-- Photo Section -->
        <div class="ideal-card">
          <label class="field-label">Inspiration Photo</label>
          <div class="photo-upload-wrapper">
            <input type="file" id="ideal-photo-input" accept="image/*" class="hidden-file-input" />
            <button id="upload-photo-btn" class="btn secondary">Choose Photo</button>
            <button id="remove-photo-btn" class="btn danger hidden">Remove</button>
          </div>
          <div id="ideal-photo-preview" class="photo-preview-container hidden">
            <img id="ideal-photo-img" src="" alt="Ideal Day Inspiration" />
          </div>
        </div>

        <!-- Planned Habits Checklist Section -->
        <div class="ideal-card">
          <label class="field-label">Habits for My Ideal Day</label>
          <p class="field-sublabel">Select the habits you want to include in this ideal routine:</p>
          <div id="ideal-habit-checklist" class="ideal-checklist"></div>
        </div>
      </div>
    </div>

  </div> <!-- /.app-container -->

  <!-- ==================== MAIN BOTTOM NAVIGATION ==================== -->
  <nav class="bottom-nav">
    <button class="nav-tab active" data-view="view-habits">
      <span class="nav-icon">✨</span>
      <span class="nav-label">Habits</span>
    </button>
    <button class="nav-tab" data-view="view-todo">
      <span class="nav-icon">📝</span>
      <span class="nav-label">To-Do</span>
    </button>
    <button class="nav-tab" data-view="view-ideal-day">
      <span class="nav-icon">🌿</span>
      <span class="nav-label">Ideal Day</span>
    </button>
  </nav>

  <!-- Add / Edit Habit Modal (Untouched) -->
  <div id="habit-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">New Habit</h2>
      
      <!-- Hidden field to store the ID of the habit being edited -->
      <input type="hidden" id="edit-habit-id" value="" />
      
      <input type="text" id="habit-name" placeholder="Habit Name" required />
      
      <label class="field-label">Frequency</label>
      <select id="habit-freq">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
        <option value="specific">Specific Days</option>
      </select>

      <div id="day-selector" class="day-selector hidden">
        <button type="button" class="day-opt" data-day="Mon">M</button>
        <button type="button" class="day-opt" data-day="Tue">T</button>
        <button type="button" class="day-opt" data-day="Wed">W</button>
        <button type="button" class="day-opt" data-day="Thu">T</button>
        <button type="button" class="day-opt" data-day="Fri">F</button>
        <button type="button" class="day-opt" data-day="Sat">S</button>
        <button type="button" class="day-opt" data-day="Sun">S</button>
      </div>

      <!-- Times Per Day Target -->
      <label class="field-label">Target per day</label>
      <input type="number" id="habit-target" value="1" min="1" max="99" />

      <label class="field-label">Choose Icon</label>
      <div class="emoji-picker" id="emoji-picker">
        <span class="emoji-opt selected">🌙</span>
        <span class="emoji-opt">💧</span>
        <span class="emoji-opt">🌸</span>
        <span class="emoji-opt">🌲</span>
        <span class="emoji-opt">🍱</span>
        <span class="emoji-opt">🚴‍♀️</span>
        <span class="emoji-opt">🤸‍♀️</span>
        <span class="emoji-opt">🏋️‍♀️</span>
        <span class="emoji-opt">🧩</span>
        <span class="emoji-opt">🧘‍♀️</span>
        <span class="emoji-opt">📸</span>
        <span class="emoji-opt">💻</span>
        <span class="emoji-opt">🚿</span>
        <span class="emoji-opt">💅🏻</span>
        <span class="emoji-opt">🐾</span>
        <span class="emoji-opt">🥘</span>
        <span class="emoji-opt">🌄</span>
        <span class="emoji-opt">🌃</span>
        <span class="emoji-opt">✨️</span>
        <span class="emoji-opt">🔮</span>
        <span class="emoji-opt">🎮</span>
        <span class="emoji-opt">🎨</span>
        <span class="emoji-opt">🎶</span>
        <span class="emoji-opt">🕯</span>
        <span class="emoji-opt">💊</span>
        <span class="emoji-opt">🧽</span>
        <span class="emoji-opt">🧹</span>
        <span class="emoji-opt">✍️</span>
        <span class="emoji-opt">🫧</span>
        <span class="emoji-opt">🗓</span>
        <span class="emoji-opt">📖</span>
        <span class="emoji-opt">📚</span>
        <span class="emoji-opt">📑</span>
        <span class="emoji-opt">🪥</span>
        <span class="emoji-opt">🛏️</span>
      </div>

      <div class="modal-actions">
        <!-- Delete button (Only visible when editing an existing habit) -->
        <button id="delete-habit-btn" class="btn danger hidden">Delete</button>
        
        <button id="cancel-btn" class="btn secondary">Cancel</button>
        <button id="save-habit-btn" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch((err) => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
