<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2E4A31">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Habits</h1>
      <button id="open-modal-btn" class="add-btn">+</button>
    </header>

    <!-- Date Navigation Bar -->
    <div class="date-navigator">
      <button id="prev-date-btn" class="nav-arrow-btn">‹</button>
      <div class="date-display-wrapper">
        <span id="date-display-label" class="date-label">Today</span>
        <button id="today-shortcut-btn" class="today-btn hidden">Go to Today</button>
      </div>
      <button id="next-date-btn" class="nav-arrow-btn">›</button>
    </div>

    <!-- Frequency Filter Tabs -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="all">All</button>
      <button class="tab-btn" data-tab="daily">Daily</button>
      <button class="tab-btn" data-tab="weekly">Weekly</button>
      <button class="tab-btn" data-tab="monthly">Monthly</button>
    </nav>

    <main>
      <!-- Active Habits -->
      <div id="active-habit-list" class="habit-list"></div>

      <!-- Completed Section -->
      <div id="completed-section" class="completed-section hidden">
        <h2>Completed</h2>
        <div id="completed-habit-list" class="habit-list"></div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Habit Modal -->
  <div id="habit-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">New Habit</h2>
      
      <!-- Hidden field to store the ID of the habit being edited -->
      <input type="hidden" id="edit-habit-id" value="" />
      
      <input type="text" id="habit-name" placeholder="Habit Name" required />
      
      <label class="field-label">Frequency</label>
      <select id="habit-freq">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
        <option value="specific">Specific Days</option>
      </select>

      <div id="day-selector" class="day-selector hidden">
        <button type="button" class="day-opt" data-day="Mon">M</button>
        <button type="button" class="day-opt" data-day="Tue">T</button>
        <button type="button" class="day-opt" data-day="Wed">W</button>
        <button type="button" class="day-opt" data-day="Thu">T</button>
        <button type="button" class="day-opt" data-day="Fri">F</button>
        <button type="button" class="day-opt" data-day="Sat">S</button>
        <button type="button" class="day-opt" data-day="Sun">S</button>
      </div>

      <!-- Times Per Day Target -->
      <label class="field-label">Target per day</label>
      <input type="number" id="habit-target" value="1" min="1" max="99" />

      <label class="field-label">Choose Icon</label>
      <div class="emoji-picker" id="emoji-picker">
        <span class="emoji-opt selected">🌙</span>
        <span class="emoji-opt">💧</span>
        <span class="emoji-opt">🌸</span>
        <span class="emoji-opt">🌲</span>
        <span class="emoji-opt">🍱</span>
        <span class="emoji-opt">🚴‍♀️</span>
        <span class="emoji-opt">🤸‍♀️</span>
        <span class="emoji-opt">🏋️‍♀️</span>
        <span class="emoji-opt">🧩</span>
        <span class="emoji-opt">🧘‍♀️</span>
        <span class="emoji-opt">📸</span>
        <span class="emoji-opt">💻</span>
        <span class="emoji-opt">🚿</span>
        <span class="emoji-opt">💅🏻</span>
        <span class="emoji-opt">🐾</span>
        <span class="emoji-opt">🥘</span>
        <span class="emoji-opt">🌄</span>
        <span class="emoji-opt">🌃</span>
        <span class="emoji-opt">✨️</span>
        <span class="emoji-opt">🔮</span>
        <span class="emoji-opt">🎮</span>
        <span class="emoji-opt">🎨</span>
        <span class="emoji-opt">🎶</span>
        <span class="emoji-opt">🕯</span>
        <span class="emoji-opt">💊</span>
        <span class="emoji-opt">🧽</span>
        <span class="emoji-opt">🧹</span>
        <span class="emoji-opt">✍️</span>
        <span class="emoji-opt">🫧</span>
        <span class="emoji-opt">🗓</span>
        <span class="emoji-opt">📖</span>
        <span class="emoji-opt">📚</span>
        <span class="emoji-opt">📑</span>
        <span class="emoji-opt">🪥</span>
        <span class="emoji-opt">🛏️</span>
      </div>

      <div class="modal-actions">
        <!-- Delete button (Only visible when editing an existing habit) -->
        <button id="delete-habit-btn" class="btn danger hidden">Delete</button>
        
        <button id="cancel-btn" class="btn secondary">Cancel</button>
        <button id="save-habit-btn" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch((err) => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
